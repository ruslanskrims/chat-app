<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle - dark blue -->
  <circle cx="100" cy="100" r="90" fill="#1E3A8A" />
  
  <!-- Chat bubble -->
  <rect x="40" y="50" width="120" height="80" rx="15" fill="white" />
  
  <!-- Tail of bubble -->
  <polygon points="70,130 60,160 90,130" fill="white" />
  
  <!-- Three dots - dark blue -->
  <circle cx="65" cy="90" r="6" fill="#1E3A8A" />
  <circle cx="100" cy="90" r="6" fill="#1E3A8A" />
  <circle cx="135" cy="90" r="6" fill="#1E3A8A" />
</svg>